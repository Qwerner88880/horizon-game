id = "cells"
name = "Energy Cells"
version = "0.1.0"
description = "Every lodestone a player places becomes an energy cell: an energy buffer any mod can fill or drain. It charges itself, shares its energy with the cells beside it and keeps it when the world is saved. It grinds cobblestone and andesite in its input slot into redstone (data/cells/recipe), and a ring of iron around it forms an energy core (data/cells/multiblock). /cell [pos] reads one; /cellgui [pos] opens its menu."
authors = ["Horizon"]
api = "0.3"
side = "server"
capabilities = ["players", "block-entities", "world", "energy", "menus", "displays", "items", "machine-recipes", "multiblocks", "saved-data", "item-hooks"]
experimental = ["block-entities", "energy", "menus", "displays", "items", "machine-recipes", "multiblocks", "saved-data", "item-hooks"]
# A placed lodestone becomes a cell that charges each tick; /cell reads it; breaking it says what was lost.
